services:
  # Backend FastAPI Web Service
  - type: web
    name: eluno-oms-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false  # Will be inputted manually in the Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: BREACH_ALERT_THRESHOLD
        value: "0.70"
      - key: PYTHON_VERSION
        value: "3.11.9"
